
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Login Page Designs</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
    background: #eef0f8;
    padding: 20px;
}

/* Navigation */

.nav {
    position: fixed;
    top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

.nav button {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: white;
    color: #333;
}

/* Common Login Container */

.login-box {
    width: 380px;
    padding: 35px;
    border-radius: 15px;
    transition: 0.4s;
}

h2 {
    text-align: center;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    margin-bottom: 25px;
    font-size: 14px;
}

input[type="email"],
input[type="password"],
input[type="text"] {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    border-radius: 8px;
    outline: none;
    border: 1px solid #ccc;
}

.login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 15px;
}

.extra {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
}

a {
    text-decoration: none;
    color: inherit;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-top: 10px;
}

/* DESIGN 1 - MINIMAL */

.design1 {
    background: white;
    color: #333;
    box-shadow: 0 10px 35px #0002;
}

.design1 .login-btn {
    background: #6c63ff;
    color: white;
}

/* DESIGN 2 - DARK */

.design2 {
    background: #171717;
    color: white;
    box-shadow: 0 10px 40px #0008;
}

.design2 input {
    background: #292929;
    color: white;
    border-color: #555;
}

.design2 input::placeholder {
    color: #aaa;
}

.design2 .login-btn {
    background: #ff416c;
    color: white;
}

/* DESIGN 3 - SPLIT STYLE */

.design3 {
    background: linear-gradient(135deg, #ff9966, #ff5e62);
    color: white;
    box-shadow: 0 10px 30px #0002;
}

.design3 input {
    border: none;
}

.design3 .login-btn {
    background: white;
    color: #ff5e62;
}

/* DESIGN 4 - GLASS */

.design4 {
    background: #ffffff25;
    color: white;
    border: 1px solid #ffffff70;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 35px #0003;
}

.design4 input {
    background: #ffffff20;
    color: white;
    border: 1px solid #ffffff90;
}

.design4 input::placeholder {
    color: white;
}

.design4 .login-btn {
    background: white;
    color: #764ba2;
}

/* DESIGN 5 - COLORFUL */

.design5 {
    background: #fff8ed;
    color: #493b31;
    border: 3px solid #ffc36b;
    box-shadow: 0 10px 30px #0002;
    border-radius: 30px;
}

.design5 input {
    background: white;
    border: 1px solid #f4c98e;
    border-radius: 20px;
}

.design5 .login-btn {
    background: #ff9f43;
    color: white;
    border-radius: 20px;
}

@media(max-width: 480px) {
    .login-box {
        width: 100%;
        max-width: 380px;
        padding: 25px;
    }

    .nav {
        position: relative;
        margin-bottom: 20px;
    }

    body {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<!-- Design Navigation -->

<div class="nav">
    <button onclick="changeDesign(1)">Minimal</button>
    <button onclick="changeDesign(2)">Dark</button>
    <button onclick="changeDesign(3)">Colorful</button>
    <button onclick="changeDesign(4)">Glass</button>
    <button onclick="changeDesign(5)">Creative</button>
</div>

<!-- Login Form -->

<div class="login-box design1" id="loginBox">

    <h2 id="heading">Welcome Back!</h2>

    <p class="subtitle" id="subtitle">
        Login to continue
    </p>

    <form id="loginForm">

        <input type="email"
               id="email"
               placeholder="Email Address"
               required>

        <input type="password"
               id="password"
               placeholder="Password"
               required>

        <div class="options">

            <label>
                <input type="checkbox"
                       id="remember"
                       style="width:auto">
                Remember me
            </label>

            <a href="#">Forgot Password?</a>

        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <p class="extra">
        Don't have an account?
        <a href="#">Sign Up</a>
    </p>

</div>

<script>

// CHANGE LOGIN DESIGNS

function changeDesign(number) {

    let box = document.getElementById("loginBox");

    box.className = "login-box";

    if(number === 1) {

        box.classList.add("design1");

        document.body.style.background = "#eef0f8";

        document.getElementById("heading").innerText =
        "Welcome Back!";

        document.getElementById("subtitle").innerText =
        "Login to continue";

    }

    else if(number === 2) {

        box.classList.add("design2");

        document.body.style.background = "#252525";

        document.getElementById("heading").innerText =
        "Dark Login";

        document.getElementById("subtitle").innerText =
        "Welcome to your account";

    }

    else if(number === 3) {

        box.classList.add("design3");

        document.body.style.background =
        "linear-gradient(135deg,#f6a36a,#f76b74)";

        document.getElementById("heading").innerText =
        "Hello There!";

        document.getElementById("subtitle").innerText =
        "Let's get started";

    }

    else if(number === 4) {

        box.classList.add("design4");

        document.body.style.background =
        "linear-gradient(135deg,#141e30,#764ba2)";

        document.getElementById("heading").innerText =
        "Glass Login";

        document.getElementById("subtitle").innerText =
        "Login with your credentials";

    }

    else if(number === 5) {

        box.classList.add("design5");

        document.body.style.background = "#fff0d8";

        document.getElementById("heading").innerText =
        "Welcome Friend!";

        document.getElementById("subtitle").innerText =
        "Happy to see you again";

    }

}

// LOGIN VALIDATION

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    if(password.length < 6) {

        alert("Password must be at least 6 characters!");

    }

    else {

        alert("Login successful! Welcome " + email);

    }

});

</script>

</body>
</html>
