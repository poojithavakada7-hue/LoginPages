
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora - Creative Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: #100d27;
    color: white;
}

/* Animated background */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background: linear-gradient(
        135deg,
        #100d27,
        #25134d,
        #102b4b,
        #160e32
    );
    background-size: 300% 300%;
    animation: gradient 12s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.65;
    animation: float 8s infinite ease-in-out;
}

.orb1 {
    width: 250px;
    height: 250px;
    background: #a855f7;
    top: -80px;
    left: -60px;
    box-shadow: 0 0 100px #a855f7;
}

.orb2 {
    width: 300px;
    height: 300px;
    background: #ec4899;
    bottom: -100px;
    right: -70px;
    box-shadow: 0 0 100px #ec4899;
    animation-delay: 2s;
}

.orb3 {
    width: 160px;
    height: 160px;
    background: #06b6d4;
    top: 45%;
    left: 15%;
    box-shadow: 0 0 90px #06b6d4;
    animation-delay: 4s;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0);
    }
    50% {
        transform: translate(35px, -45px);
    }
}

/* Main layout */

.container {
    width: 90%;
    max-width: 1050px;
    min-height: 620px;
    display: flex;
    align-items: center;
    border: 1px solid #ffffff35;
    border-radius: 30px;
    overflow: hidden;
    background: #ffffff12;
    backdrop-filter: blur(25px);
    box-shadow: 0 25px 80px #0007;
}

/* Left content */

.left {
    width: 50%;
    padding: 55px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #d8b4fe;
}

.left h1 {
    font-size: 48px;
    line-height: 1.2;
    margin-top: 65px;
    margin-bottom: 20px;
}

.left h1 span {
    background: linear-gradient(
        90deg,
        #c084fc,
        #f472b6,
        #67e8f9
    );
    -webkit-background-clip: text;
    color: transparent;
}

.left p {
    color: #c5c1d8;
    line-height: 1.8;
    font-size: 15px;
}

.explore {
    display: inline-block;
    margin-top: 35px;
    padding: 13px 28px;
    border: 1px solid #d8b4fe;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

.explore:hover {
    background: #a855f7;
    box-shadow: 0 0 25px #a855f7;
}

/* Decorative rings */

.art {
    margin-top: 45px;
    width: 180px;
    height: 180px;
    margin-left: 50px;
    border-radius: 50%;
    border: 2px solid #ffffff50;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow:
        0 0 30px #a855f755,
        inset 0 0 30px #a855f755;
    animation: rotate 12s linear infinite;
}

.art-inner {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        #c084fc,
        #ec4899,
        #22d3ee
    );
    box-shadow: 0 0 50px #c084fc;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

/* Right login */

.right {
    width: 50%;
    padding: 55px 65px;
    background: #ffffff08;
    min-height: 620px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.heading {
    margin-bottom: 35px;
}

.heading h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.heading p {
    color: #bbb8d0;
    font-size: 14px;
}

/* Form */

.input-group {
    margin-bottom: 22px;
}

.input-group label {
    display: block;
    margin-bottom: 10px;
    font-size: 13px;
    color: #ded9ef;
}

.input-group input {
    width: 100%;
    padding: 16px;
    border: 1px solid #ffffff35;
    background: #ffffff12;
    border-radius: 12px;
    color: white;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.input-group input::placeholder {
    color: #aaa5c0;
}

.input-group input:focus {
    border-color: #c084fc;
    box-shadow: 0 0 15px #a855f755;
}

/* Password */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.show-btn {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #d8b4fe;
    cursor: pointer;
    font-size: 12px;
}

/* Options */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #c5c1d8;
    margin: 8px 0 25px;
}

.options a,
.signup a {
    color: #d8b4fe;
    text-decoration: none;
}

.options a:hover,
.signup a:hover {
    text-decoration: underline;
}

/* Login button */

.login-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(
        90deg,
        #9333ea,
        #ec4899
    );
    box-shadow: 0 8px 25px #a855f755;
    transition: 0.3s;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px #ec489988;
}

.signup {
    text-align: center;
    margin-top: 30px;
    font-size: 13px;
    color: #bbb8d0;
}

/* Mobile */

@media(max-width: 800px) {
    body {
        overflow-y: auto;
        padding: 25px 0;
    }

    .container {
        flex-direction: column;
        max-width: 450px;
        margin: auto;
    }

    .left, .right {
        width: 100%;
        padding: 35px;
    }

    .left h1 {
        font-size: 36px;
        margin-top: 35px;
    }

    .art {
        width: 120px;
        height: 120px;
        margin: 25px auto 0;
    }

    .art-inner {
        width: 70px;
        height: 70px;
    }

    .right {
        min-height: auto;
    }
}

@media(max-width: 400px) {
    .left, .right {
        padding: 25px;
    }

    .left h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- Background -->

<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<!-- Main Container -->

<div class="container">

    <!-- Left Section -->

    <div class="left">

        <div class="logo">AURORA.</div>

        <h1>
            Unlock Your
            <span>Creative</span>
            World.
        </h1>

        <p>
            Welcome to a beautiful digital experience.
            Sign in and discover a world of creativity,
            inspiration and endless possibilities.
        </p>

        <a href="#" class="explore">Explore More →</a>

        <div class="art">
            <div class="art-inner"></div>
        </div>

    </div>

    <!-- Right Section -->

    <div class="right">

        <div class="heading">
            <h2>Welcome Back!</h2>
            <p>Enter your details to access your account.</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>Username or Email</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="show-btn"
                        id="toggle">
                        SHOW
                    </button>

                </div>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Sign In →
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#" onclick="register(event)">
                Create Account
            </a>
        </div>

    </div>

</div>

<script>

// Show and hide password

const passwordInput =
document.getElementById("password");

const toggleButton =
document.getElementById("toggle");

toggleButton.addEventListener("click", function() {

    if(passwordInput.type === "password") {

        passwordInput.type = "text";
        toggleButton.innerText = "HIDE";

    } else {

        passwordInput.type = "password";
        toggleButton.innerText = "SHOW";

    }

});

// Login validation

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let username =
    document.getElementById("username").value.trim();

    let password =
    passwordInput.value;

    if(username === "" || password === "") {

        alert("Please fill all fields!");

    } else if(password.length < 6) {

        alert("Password must contain at least 6 characters!");

    } else {

        alert("Welcome " + username + "! Login submitted successfully.");

    }

});

// Forgot password

function forgotPassword(event) {

    event.preventDefault();

    alert("Password recovery feature selected!");

}

// Create account

function register(event) {

    event.preventDefault();

    alert("Registration page selected!");

}

</script>

</body>
</html>
