
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    background: #080b20;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;
}

/* Galaxy background */

.space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    background:
        radial-gradient(circle at 15% 20%, #342064 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, #172d68 0%, transparent 35%),
        linear-gradient(135deg, #080b20, #15102f, #090d25);
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.5); }
}

/* Floating planet */

.planet {
    position: absolute;
    width: 270px;
    height: 270px;
    border-radius: 50%;
    top: -80px;
    right: -70px;
    background: linear-gradient(
        135deg,
        #ff65c3,
        #8b5cf6,
        #263e9a
    );
    box-shadow:
        0 0 50px #a855f7,
        0 0 100px #9333ea66;
    animation: planetMove 7s ease-in-out infinite;
}

.planet::before {
    content: "";
    position: absolute;
    width: 380px;
    height: 90px;
    border: 5px solid #e0a5ff;
    border-radius: 50%;
    top: 90px;
    left: -55px;
    transform: rotate(-25deg);
}

@keyframes planetMove {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(25px); }
}

/* Main container */

.container {
    width: 90%;
    max-width: 1050px;
    min-height: 620px;
    display: flex;
    border-radius: 30px;
    overflow: hidden;
    background: #ffffff0b;
    border: 1px solid #ffffff30;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 80px #0008;
    position: relative;
    z-index: 1;
}

/* Left section */

.left {
    width: 50%;
    padding: 65px 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #e0a5ff;
}

.left h1 {
    font-size: 48px;
    line-height: 1.2;
    margin-top: 50px;
    margin-bottom: 20px;
}

.left h1 span {
    background: linear-gradient(
        90deg,
        #e879f9,
        #8b5cf6,
        #67e8f9
    );
    -webkit-background-clip: text;
    color: transparent;
}

.left p {
    color: #b9b9d1;
    line-height: 1.8;
    font-size: 15px;
}

.left .tagline {
    margin-top: 30px;
    color: #d8b4fe;
    font-size: 13px;
    letter-spacing: 2px;
}

/* Planet illustration */

.planet-art {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 35px auto 0;
    background: linear-gradient(
        135deg,
        #f472b6,
        #9333ea,
        #312e81
    );
    box-shadow:
        0 0 35px #a855f7,
        inset -20px -20px 35px #080b20;
    position: relative;
}

.planet-art::after {
    content: "";
    position: absolute;
    width: 210px;
    height: 55px;
    border: 4px solid #e9a8ff;
    border-radius: 50%;
    top: 47px;
    left: -30px;
    transform: rotate(-20deg);
}

/* Right section */

.right {
    width: 50%;
    padding: 65px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #ffffff08;
}

.heading {
    margin-bottom: 35px;
}

.heading h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.heading p {
    color: #aaaac4;
    font-size: 14px;
}

/* Form fields */

.input-group {
    margin-bottom: 22px;
}

.input-group label {
    display: block;
    margin-bottom: 10px;
    color: #dedaf1;
    font-size: 13px;
}

.input-group input {
    width: 100%;
    padding: 16px;
    border: 1px solid #ffffff30;
    background: #ffffff0d;
    color: white;
    border-radius: 12px;
    outline: none;
    font-size: 14px;
}

.input-group input::placeholder {
    color: #8888a5;
}

.input-group input:focus {
    border-color: #c084fc;
    box-shadow: 0 0 15px #a855f744;
}

/* Password visibility */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #d8b4fe;
    cursor: pointer;
    font-size: 12px;
}

/* Remember and forgot */

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 28px;
    font-size: 12px;
    color: #bcbcd3;
}

.options a {
    color: #e0a5ff;
    text-decoration: none;
}

/* Login button */

.login-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(
        90deg,
        #a855f7,
        #ec4899
    );
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px #a855f755;
    transition: 0.3s;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 35px #ec489988;
}

/* Register */

.register {
    text-align: center;
    margin-top: 30px;
    color: #aaaac4;
    font-size: 13px;
}

.register a {
    color: #e0a5ff;
    text-decoration: none;
    font-weight: bold;
}

/* Responsive */

@media(max-width: 800px) {
    body {
        padding: 25px 0;
    }

    .container {
        flex-direction: column;
        max-width: 460px;
    }

    .left, .right {
        width: 100%;
        padding: 35px;
    }

    .left h1 {
        font-size: 36px;
        margin-top: 30px;
    }

    .planet-art {
        width: 100px;
        height: 100px;
        margin-top: 25px;
    }

    .planet-art::after {
        width: 140px;
        height: 40px;
        top: 30px;
        left: -20px;
    }

    .right {
        padding-top: 45px;
        padding-bottom: 45px;
    }

    .planet {
        width: 160px;
        height: 160px;
    }
}

@media(max-width: 400px) {
    .left, .right {
        padding: 25px;
    }

    .left h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- Background -->

<div class="space" id="space">
    <div class="planet"></div>
</div>

<!-- Main container -->

<div class="container">

    <!-- Left panel -->

    <div class="left">

        <div class="logo">✦ COSMORA</div>

        <h1>
            Explore Beyond
            <span>Limits.</span>
        </h1>

        <p>
            Every great journey begins with a single step.
            Sign in and enter your own universe of creativity,
            possibilities and inspiration.
        </p>

        <div class="tagline">
            ✦ YOUR JOURNEY STARTS HERE
        </div>

        <div class="planet-art"></div>

    </div>

    <!-- Right panel -->

    <div class="right">

        <div class="heading">
            <h2>Welcome Back!</h2>
            <p>Sign in to continue your journey.</p>
        </div>

        <form id="loginForm">

            <div class="input-group">
                <label>Username / Email</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">
                        SHOW
                    </button>

                </div>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-btn">
                Sign In ✦
            </button>

        </form>

        <div class="register">
            New to Cosmora?
            <a href="#" onclick="register(event)">
                Create an account
            </a>
        </div>

    </div>

</div>

<script>

// Generate animated stars

const space = document.getElementById("space");

for(let i = 0; i < 100; i++) {

    let star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";

    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    space.appendChild(star);

}

// Show / Hide password

const password =
document.getElementById("password");

const showPassword =
document.getElementById("showPassword");

showPassword.addEventListener("click", function() {

    if(password.type === "password") {

        password.type = "text";
        showPassword.innerText = "HIDE";

    } else {

        password.type = "password";
        showPassword.innerText = "SHOW";

    }

});

// Login validation

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let username =
    document.getElementById("username").value.trim();

    let passwordValue = password.value;

    if(username === "" || passwordValue === "") {

        alert("Please fill in all fields!");

    } else if(passwordValue.length < 6) {

        alert("Password must contain at least 6 characters!");

    } else {

        alert("Welcome to Cosmora, " + username + "!");

    }

});

// Forgot password

function forgotPassword(event) {

    event.preventDefault();

    alert("Password recovery selected!");

}

// Register

function register(event) {

    event.preventDefault();

    alert("Create account selected!");

}

</script>

</body>
</html>
