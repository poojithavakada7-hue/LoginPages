
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Again - Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9eaf2;
    overflow-x: hidden;
    padding: 35px 15px;
}

/* Background circles */

.circle {
    position: fixed;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
}

.circle1 {
    width: 30px;
    height: 30px;
    top: 5%;
    left: 3%;
}

.circle2 {
    width: 17px;
    height: 17px;
    top: 3%;
    right: 24%;
}

.circle3 {
    width: 9px;
    height: 9px;
    top: 6%;
    right: 34%;
}

.circle4 {
    width: 12px;
    height: 12px;
    bottom: 5%;
    left: 40%;
}

.circle5 {
    width: 9px;
    height: 9px;
    top: 23%;
    right: 3%;
}

/* Main container */

.container {
    width: 100%;
    max-width: 1065px;
    min-height: 755px;
    display: flex;
    padding: 10px;
    background: rgba(255,255,255,0.45);
    border: 2px solid white;
    border-radius: 38px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.08);
    position: relative;
    z-index: 1;
}

/* Left illustration section */

.left-panel {
    width: 52%;
    background: linear-gradient(145deg, #d38af3, #d28bf0, #c77ae9);
    border-radius: 27px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

.illustration {
    width: 100%;
    max-width: 490px;
    padding: 20px;
}

/* Right login section */

.right-panel {
    width: 48%;
    padding: 25px 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
}

/* Register link */

.register {
    position: absolute;
    top: 25px;
    right: 45px;
    font-size: 12px;
    color: #333;
}

.register a {
    color: #4388d6;
    text-decoration: none;
    font-weight: 600;
}

/* Login heading */

.login-heading {
    text-align: center;
    margin-bottom: 40px;
}

.login-heading h1 {
    font-size: 27px;
    color: #282735;
    margin-bottom: 12px;
    font-weight: 700;
}

.login-heading p {
    font-size: 14px;
    color: #777785;
}

/* Form */

.form-group {
    margin-bottom: 15px;
}

.form-group input {
    width: 100%;
    height: 57px;
    padding: 0 23px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.92);
    font-size: 14px;
    color: #333;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
}

.form-group input:focus {
    box-shadow: 0 0 0 2px #d8a0ef;
}

.form-group input::placeholder {
    color: #a0a0aa;
}

/* Password */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.toggle-password {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    color: #999;
    font-size: 18px;
}

/* Recovery */

.recovery {
    text-align: right;
    margin: 24px 5px 35px;
}

.recovery a {
    font-size: 13px;
    color: #777785;
    text-decoration: none;
}

/* Sign in button */

.signin-btn {
    width: 100%;
    height: 57px;
    background: #ff696b;
    color: white;
    border: none;
    border-radius: 11px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 12px 25px rgba(255,105,107,0.15);
}

.signin-btn:hover {
    background: #ed555c;
    transform: translateY(-2px);
}

/* Divider */

.divider {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 43px 0 32px;
    color: #777785;
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #ddd);
}

.divider::after {
    background: linear-gradient(to left, transparent, #ddd);
}

/* Social login */

.social-login {
    display: flex;
    justify-content: center;
    gap: 22px;
}

.social-btn {
    width: 76px;
    height: 53px;
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 10px;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
    font-size: 25px;
    transition: 0.3s;
    display: flex;
    justify-content: center;
    align-items: center;
}

.social-btn:hover {
    background: white;
    transform: translateY(-4px);
    box-shadow: 0 8px 15px #0001;
}

.google {
    color: #4285f4;
    font-weight: bold;
}

.apple {
    color: #222;
}

.facebook {
    background: #1877f2;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-weight: bold;
    font-size: 23px;
    padding-top: 5px;
}

/* Responsive design */

@media(max-width: 800px) {
    .container {
        max-width: 500px;
        flex-direction: column;
        min-height: auto;
    }

    .left-panel {
        width: 100%;
        min-height: 300px;
    }

    .illustration {
        max-width: 300px;
    }

    .right-panel {
        width: 100%;
        min-height: 570px;
        padding: 90px 30px 35px;
    }

    .register {
        top: 25px;
        right: 25px;
    }
}

@media(max-width: 400px) {
    .right-panel {
        padding-left: 18px;
        padding-right: 18px;
    }

    .social-login {
        gap: 12px;
    }
}
</style>
</head>

<body>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="register">
            Not a member?
            <a href="#" onclick="registerUser(event)">
                Register now
            </a>
        </div>

        <div class="login-heading">
            <h1>Hello Again!</h1>
            <p>Welcome back you've been missed!</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <input type="text"
                       id="username"
                       placeholder="Enter username"
                       required>
            </div>

            <div class="form-group password-box">

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>

                <button type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password">
                    ◉
                </button>

            </div>

            <div class="recovery">
                <a href="#" onclick="recoverPassword(event)">
                    Recovery Password
                </a>
            </div>

            <button type="submit" class="signin-btn">
                Sign In
            </button>

        </form>

        <div class="divider">
            Or continue with
        </div>

        <!-- Social Login -->

        <div class="social-login">

            <button class="social-btn google"
                    onclick="socialLogin('Google')">
                G
            </button>

            <button class="social-btn apple"
                    onclick="socialLogin('Apple')">
                
            </button>

            <button class="social-btn">
                <span class="facebook"
                      onclick="socialLogin('Facebook')">
                    f
                </span>
            </button>

        </div>

    </div>

</div>

<script>

// Show and hide password

const password = document.getElementById("password");

const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", function() {

    if(password.type === "password") {

        password.type = "text";
        toggle.innerText = "◎";
        toggle.setAttribute("aria-label", "Hide password");

    } else {

        password.type = "password";
        toggle.innerText = "◉";
        toggle.setAttribute("aria-label", "Show password");

    }

});

// Login validation

document.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    let username =
    document.getElementById("username").value.trim();

    let passwordValue = password.value;

    if(username === "" || passwordValue === "") {

        alert("Please enter all details!");

    }

    else if(passwordValue.length < 6) {

        alert("Password must contain at least 6 characters!");

    }

    else {

        alert("Welcome " + username + "! Login form submitted successfully.");

    }

});

// Recovery password

function recoverPassword(event) {

    event.preventDefault();

    let username =
    document.getElementById("username").value.trim();

    if(username === "") {

        alert("Please enter your username first.");

    } else {

        alert("Password recovery requested for " + username);

    }

}

// Register

function registerUser(event) {

    event.preventDefault();

    alert("Registration page will open here!");

}

// Social login

function socialLogin(platform) {

    alert("You selected " + platform + " login.");

}

</script>
